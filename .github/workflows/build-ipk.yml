name: Build IPK

# 打 tag（例如 v1.0.0）时自动构建并发布；也可以在 Actions 页面手动触发试跑
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # 想跟新 ImmortalWrt 版本时，只改这一行
  IWRT_VERSION: '24.10.6'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ------------------------------------------------------------------
          # 一行 = 一个「架构」，不是一个「型号」。
          #
          # 同一个架构下所有设备共用同一个 .ipk，所以 MT7981 和 IPQ807x
          # （都是 aarch64_cortex-a53）只需要跑一次。
          #
          #   goarch → 传给 ./build-go.sh
          #   sdk    → ImmortalWrt 的 target/subtarget。只要架构对得上就行，
          #            不要求和设备型号一一对应。
          #            完整列表: https://downloads.immortalwrt.org/releases/24.10.6/targets/
          #
          # 如果某个 sdk 下没有发布 SDK，这一行会「跳过并给出警告」，
          # 不会把整行跑红，也不影响其他架构。
          # ------------------------------------------------------------------
          - { name: x86_64,             goarch: amd64,            sdk: 'x86/64' }
          - { name: aarch64-cortex-a53, goarch: arm64,            sdk: 'mediatek/filogic' }
          - { name: aarch64-generic,    goarch: arm64,            sdk: 'armsr/armv8' }
          - { name: mipsel-24kc,        goarch: mipsle-softfloat, sdk: 'ramips/mt7621' }
          - { name: mips-24kc,          goarch: mips-softfloat,   sdk: 'ath79/generic' }
          - { name: arm-cortex-a7,      goarch: arm-v7,           sdk: 'sunxi/cortexa7' }
          - { name: arm-cortex-a9,      goarch: arm-v7,           sdk: 'mvebu/cortexa9' }

    steps:
      - uses: actions/checkout@v4

      - name: 安装打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd make gcc file

      # ------------------------------------------------------------------
      # 先确认这个架构有没有 SDK，没有就跳过。
      # 这样别人往 matrix 里加架构、target 名写错时，只影响那一行。
      # ------------------------------------------------------------------
      - name: 下载并解压 SDK
        id: sdk
        run: |
          BASE="https://downloads.immortalwrt.org/releases/${IWRT_VERSION}/targets/${{ matrix.sdk }}/"
          echo "SDK 目录: $BASE"

          # 从目录索引里抓 SDK 文件名，避免把 gcc 版本号写死在这里
          LISTING="$(curl -fsSL "$BASE" 2>/dev/null || true)"
          SDK_FILE="$(printf '%s' "$LISTING" | grep -oE 'immortalwrt-sdk-[A-Za-z0-9._-]+\.tar\.zst' | head -n1)"

          if [ -z "$SDK_FILE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=跳过 ${{ matrix.name }}::$BASE 下没找到 SDK，这个 target 可能没有发布 SDK 或 subtarget 名字写错了。换一个 target 即可，见 https://downloads.immortalwrt.org/releases/${IWRT_VERSION}/targets/"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "SDK: $SDK_FILE"
          curl -fsSL -o "/tmp/$SDK_FILE" "$BASE$SDK_FILE"
          mkdir -p ~/sdk
          tar --zstd -xf "/tmp/$SDK_FILE" -C ~/sdk
          rm -f "/tmp/$SDK_FILE"
          du -sh ~/sdk/*

      - uses: actions/setup-go@v5
        if: steps.sdk.outputs.skip != 'true'
        with:
          go-version: 'stable'

      - name: 交叉编译 Go 二进制
        if: steps.sdk.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          chmod +x build-go.sh build-ipk.sh
          ./build-go.sh ${{ matrix.goarch }}

      - name: 打成 ipk
        if: steps.sdk.outputs.skip != 'true'
        working-directory: openwrt
        run: |
          SDK_DIR="$(ls -d ~/sdk/immortalwrt-sdk-* | head -n1)"
          echo "使用 SDK: $SDK_DIR"
          ./build-ipk.sh "$SDK_DIR"

      - name: 上传产物
        if: steps.sdk.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.name }}
          path: openwrt/dist/*.ipk
          if-no-files-found: error

  release:
    # 只在打 tag 时把 ipk 附到 Release 上；手动触发只留 artifact
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物
        run: |
          mkdir -p out

          # 架构相关的包：每个 job 各一份，文件名自带架构，不会重名
          find artifacts -name 'ruijie_*.ipk' -exec cp -v {} out/ \;

          # 架构无关的 LuCI 包：每个 job 产出的内容一样，只取一份
          LUCI_IPK="$(find artifacts -name 'luci-app-ruijie_*.ipk' | head -n1)"
          if [ -n "$LUCI_IPK" ]; then
            cp -v "$LUCI_IPK" out/
          fi

          echo "--- 将发布 ---"
          ls -l out/

          if [ "$(find out -name '*.ipk' | wc -l)" -eq 0 ]; then
            echo "::error::一个 ipk 都没有产出，检查 build 里的各个架构是否全被跳过了"
            exit 1
          fi

      - name: 附到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.ipk
          generate_release_notes: true
